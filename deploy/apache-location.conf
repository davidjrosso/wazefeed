# Include only in the existing davidrosso.ar HTTPS VirtualHost.
ProxyRequests Off
RedirectMatch 308 ^/waze$ /waze/
ProxyPass /waze/ unix:/var/lib/waze-closures-socket/app.sock|http://waze-local/waze/ connectiontimeout=5 timeout=35 retry=0
ProxyPassReverse /waze/ http://waze-local/waze/
<Location /waze/>
    ProxyAddHeaders Off
    # Replace, never append: untrusted clients cannot forge the IP.
    RequestHeader set X-Forwarded-For "expr=%{CONN_REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset SCRIPT_NAME
    RequestHeader unset PATH_INFO
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Server
    LimitRequestBody 1048576
    Header always set Cache-Control "no-store"
</Location>
